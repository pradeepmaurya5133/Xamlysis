{% extends 'base1.html' %}

{% block title %}Login{% endblock title %}

{% block body %}
<section class="form-page">
  <div class="form-card">
    <h1>Welcome Back</h1>
    <p class="text-muted mb-4">Login to continue to your Xamlysis dashboard.</p>
    <form method="post" action="" autocomplete="on" name="login">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block" type="submit">Login</button>
    </form>
    <p class="text-center mt-4 mb-0">Do not have an account? <a href="/temp_sign_up">Create one</a>.</p>
  </div>
</section>
{% endblock body %}
