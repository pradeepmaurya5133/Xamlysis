{% extends 'base1.html' %}

{% block title %}Account{% endblock title %}

{% block body %}
<section class="form-page">
  <div class="form-card">
    <h1>Account Details</h1>
    <p class="text-muted mb-4">Fill in the details below to continue.</p>
    <form method="post" action="" autocomplete="on" name="stu_sign_up">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block" type="submit">Submit</button>
    </form>
    <p class="text-center mt-4 mb-0">Already have an account? <a href="/login">Login</a>.</p>
  </div>
</section>
{% endblock body %}
