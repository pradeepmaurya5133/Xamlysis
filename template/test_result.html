{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Xamlysis | Result</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'style.css' %}">
  </head>
  <body>
    <main class="result-page">
      <article class="result-card">
        <img src="{% static 'img/online_exam_1.png' %}" alt="Exam result">
        <div class="p-4">
          <h1 class="mb-2">Exam Complete</h1>
          <p class="text-muted mb-0">Review your attempt summary below.</p>
        </div>
        <div class="result-summary">
          <div><strong>Score</strong><br>{{ score }} / {{ total }}</div>
          <div><strong>Percentage</strong><br>{{ percent }}%</div>
          <div><strong>Time Taken</strong><br>{{ time }} seconds</div>
          <div><strong>Correct Answers</strong><br>{{ correct }}</div>
          <div><strong>Incorrect Answers</strong><br>{{ wrong }}</div>
          <div><strong>Status</strong><br>Submitted</div>
        </div>
        <div class="px-4 pb-4">
          <form action="/returner/" method="post">
            {% csrf_token %}
            <button class="btn btn-primary btn-lg btn-block" type="submit">Return To Dashboard</button>
          </form>
        </div>
      </article>
    </main>
  </body>
</html>
