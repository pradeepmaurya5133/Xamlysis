# Render Blueprint. In the Render dashboard: New > Blueprint, point it at this
# repository, and it creates the web service and the Postgres database together,
# wiring DATABASE_URL between them and generating the secrets.
services:
  - type: web
    name: xamlysis
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn Online_Exam_Portal_Xamlysis.wsgi:application"
    healthCheckPath: /
    envVars:
      # Tells settings.py it is running on a platform, so DEBUG stays off.
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Generated once by Render and kept across deploys.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Used by build.sh to create the admin account. Read the value from the
      # service's Environment tab to sign in at /admin/.
      - key: DJANGO_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: xamlysis-db
          property: connectionString

databases:
  - name: xamlysis-db
    databaseName: xamlysis
    plan: free
    region: singapore
